<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="View 180° stereo photos in the browser, including as an installed app.">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="180 Viewer">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <title>180 Stereo Photo Viewer</title>
    <style>
        /*
         * iOS installed PWAs size position:fixed / 100% / 100dvh to the *small*
         * viewport, leaving a home-indicator-tall gap that paints white. Use the
         * large viewport (100vh / 100lvh) in standalone, and keep html black as
         * a safety net for any unpainted edge.
         */
        html {
            background: #000 !important;
            color-scheme: dark;
        }
        html, body,
        html.a-fullscreen,
        html.a-fullscreen body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000 !important;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        .a-scene,
        html.a-fullscreen .a-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            background: #000 !important;
        }
        @media (display-mode: standalone), (display-mode: fullscreen) {
            html.a-fullscreen {
                /* A-Frame pins top/bottom:0 to the *small* viewport on iOS. */
                bottom: auto !important;
                height: 100vh !important;
                height: 100lvh !important;
            }
            html, body,
            html.a-fullscreen body,
            .a-scene,
            html.a-fullscreen .a-canvas {
                bottom: auto !important;
                height: 100vh !important;
                height: 100lvh !important;
                min-height: 100vh !important;
                min-height: 100lvh !important;
            }
        }
        /* iOS Safari sets navigator.standalone but not always display-mode. */
        html.ios-standalone.a-fullscreen {
            bottom: auto !important;
            height: 100vh !important;
            height: 100lvh !important;
        }
        html.ios-standalone,
        html.ios-standalone body,
        html.ios-standalone.a-fullscreen body,
        html.ios-standalone .a-scene,
        html.ios-standalone.a-fullscreen .a-canvas {
            bottom: auto !important;
            height: 100vh !important;
            height: 100lvh !important;
            min-height: 100vh !important;
            min-height: 100lvh !important;
        }
    </style>
    <script>
        if (navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
            document.documentElement.classList.add('ios-standalone');
        }
    </script>
    <!--  A-Frame (https://github.com/aframevr/aframe)
          Copyright © 2015-2017 A-Frame authors.
          MIT License (https://github.com/aframevr/aframe/blob/master/LICENSE)  -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <!--  Exif.js (https://github.com/exif-js/exif-js)
          Copyright (c) 2008 Jacob Seidelin
          MIT License (https://github.com/exif-js/exif-js/blob/master/LICENSE.md)

          Added support for Extended XMP for VR180 photos. (https://github.com/chiqden/exif-js/tree/add_support_for_extended_xmp)  -->
    <script src="scripts/exif-js-v2.3.0-added-support-for-extended-xmp.js"></script>
    <!--  180 Stereo Photo Viewer (https://github.com/chiqden/180-stereo-photo-viewer)
          Copyright (c) 2019 chiqden
          MIT License (https://github.com/chiqden/180-stereo-photo-viewer/blob/master/LICENSE)  -->
    <script src="scripts/180-stereo-photo-viewer.js"></script>
    <script src="scripts/offline-support.js"></script>
</head>
<body>
<a-scene 180-stereo-photo-viewer file-picker loading-screen="backgroundColor: black" background="color: black">
    <a-assets>
        <img id="stereoImage" src="">
    </a-assets>
    <a-entity recenter>
        <a-camera position="0 0 0" look-controls="reverseMouseDrag: true" wasd-controls-enabled="false"></a-camera>
    </a-entity>
    <a-text id="loadingText" position="0 0 -1" width="3" value="Loading..." align="center" visible="true"></a-text>
    <a-text id="usageText"
        position="0 0 -1"
        width="2"
        value="Double-click/tap
or drag and drop a file
to select a photo.

Space/long-press to
recenter view

Scroll to zoom,
Arrow up/down to
rotate image vertically"
        align="center"
        visible="false"
    ></a-text>
</a-scene>
</body>
</html>
